<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập / Đăng Ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body class="bg-light">

    <<main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <!-- FORM ĐĂNG NHẬP -->
                <div class="form-box form-login form_login">
                    <h4 class="mb-3">Đăng Nhập</h4>
                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label">Email hoặc Tên đăng nhập</label>
                            <input type="text" class="form-control name_login"
                                placeholder="Nhập email hoặc tên đăng nhập">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control passwork_login" placeholder="Nhập mật khẩu">
                        </div>
                        <button type="submit" id="login_button" class="btn btn-primary w-100 sign_in">Đăng Nhập</button>

                        <p class="text-center mt-3">
                            Chưa có tài khoản? <a href="#" id="showRegister">Đăng ký ngay</a>
                        </p>
                    </form>
                </div>
                <!-- FORM ĐĂNG KÝ -->
                <div class="form-box form-register from_sigin" style="display: none;">
                    <h4 class="mb-3 create_logine">Đăng Ký</h4>
                    <form id="formRegister">
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input type="text" class="form-control name_sigin" placeholder="Nhập họ tên">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu</label>
                            <input type="password" class="form-control password_login" placeholder="Tạo mật khẩu">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" class="form-control password_login2" placeholder="Nhập lại mật khẩu">
                        </div>
                        <button type="submit" id="register_button" class="btn btn-success w-100">Đăng Ký</button>

                        <p class="text-center mt-3">
                            Đã có tài khoản? <a href="#" id="showLogin">Đăng nhập</a>
                        </p>
                    </form>
                </div>
            </div>
        </div>
        </main>

        <script src="login.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <footer class="footer container-fluid bg-dark text-light  " style="margin-top: 0px;">

</body>

</html>
